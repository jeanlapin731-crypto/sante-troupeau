<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santé Troupeau</title>
<meta name="theme-color" content="#2f6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Santé Troupeau">
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#1f2a1f;--mute:#667066;--line:#dfe4dc;--pri:#2f6b3a;--pri2:#e5f0e6;--warn:#b26b00;--warn2:#fff4e0;--bad:#b3261e;--bad2:#fde8e6;--ok:#2f6b3a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 12px 0 0}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px}
nav button.on{background:#fff;color:var(--pri);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid #c9d0c6;border-radius:6px;background:#fff;color:var(--ink);min-width:0}
textarea{min-height:70px}
button.b{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit}
button.b2{background:var(--pri2);color:var(--pri);border:1px solid #c5dbc8;border-radius:6px;padding:7px 11px;cursor:pointer;font:inherit}
button.del{background:var(--bad2);color:var(--bad);border:1px solid #f2c4bf;border-radius:6px;padding:5px 9px;cursor:pointer}
button.sm{padding:4px 8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#eef2ec;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eef2ec}
.pill.w{background:var(--warn2);color:var(--warn)}.pill.r{background:var(--bad2);color:var(--bad)}.pill.g{background:var(--pri2);color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:26px}
.kpi span{color:var(--mute);font-size:13px}
.mute{color:var(--mute)}
.alert{padding:8px 10px;border-radius:6px;margin:4px 0}
.alert.w{background:var(--warn2);color:#6b4100}.alert.r{background:var(--bad2);color:#7a1a14}
dialog{border:0;border-radius:12px;padding:0;width:min(960px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:16px;overflow:auto;max-height:92vh}
dialog h3{margin:0 0 12px}
.ligne{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:#fafbf9}
.anlist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;columns:3 200px}
.anlist label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px;break-inside:avoid}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;position:sticky;bottom:-16px;background:#fff;padding:10px 0}
.hint{font-size:12px;color:var(--mute)}
.calc{font-size:13px;color:var(--pri);margin-top:6px}
#login{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.lbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.lbox h2{margin:0 0 6px;color:var(--pri)}
.lbox .err{color:var(--bad);font-size:14px}
@media print{header,.noprint,button{display:none!important}body{background:#fff}.card{border:0;padding:0}main{padding:0}}
@media (max-width:600px){main{padding:10px}header h1{width:100%}}
</style>
</head>

function addDays(d,n){const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+Number(n||0));return x.toISOString().slice(0,10)}
function fd(d){if(!d)return'';const[y,m,j]=d.split('-');return`${j}/${m}/${y}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return isNaN(n)?null:n};
const fmt=n=>n==null?'':(Math.round(n*100)/100).toLocaleString('fr-FR');

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.produits){mergeCatalogue(s);return s}}catch(e){}return blank()}
let S=load();
function save(){if(window.CLOUD){CLOUD.push();return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Impossible d'enregistrer dans le navigateur : "+e.message)}}
function getS(){return S}
function setS(d){S=d}
if(!window.FIREBASE_CONFIG)save();

const P=id=>S.produits.find(p=>p.id===id);

const L=id=>S.lots.find(l=>l.id===id);
const prodByName=n=>S.produits.find(p=>p.nom.toLowerCase()===String(n).trim().toLowerCase());
function stock(pid){return S.mouvements.filter(m=>m.produitId===pid).reduce((s,m)=>s+(m.type==='sortie'?-m.qte:m.qte),0)}
function suivi(p){return p.seuil!=null||S.mouvements.some(m=>m.produitId===p.id)}
/* Seuil d'alerte : celui saisi à la main, sinon automatique = 20 % de la dernière livraison (nombre × contenance), ou 20 % d'un conditionnement */
function seuilAuto(p){const e=S.mouvements.filter(m=>m.produitId===p.id&&m.type==='entree'&&m.qte>0).sort((a,b)=>b.date.localeCompare(a.date))[0];const base=e?e.qte:p.contenance;return base?Math.round(base*0.2*100)/100:null}
function seuilEff(p){return p.seuil!=null?p.seuil:seuilAuto(p)}
function seuilTxt(p){const s=seuilEff(p);return s==null?'<span class="mute">—</span>':fmt(s)+' '+esc(p.unite)+(p.seuil==null?' <span class="pill">auto 20 %</span>':'')}
/* Ajoute aux données existantes les produits du catalogue qui n'y sont pas encore (mises à jour de l'appli) */
function mergeCatalogue(s){const noms=new Set(s.produits.map(p=>p.nom.toLowerCase()));let n=0;CATALOGUE.forEach(c=>{if(!noms.has(c[0].toLowerCase())){s.produits.push({id:uid(),nom:c[0],principe:c[1],cat:c[2],unite:c[3],contenance:c[4],attL:c[5],attV:c[6],seuil:null,custom:false});n++}});return n}
function peremption(pid){const d=S.mouvements.filter(m=>m.produitId===pid&&m.type==='entree'&&m.peremption).map(m=>m.peremption).sort();return d.find(x=>x>=addDays(today(),-365))||null}
function attTxt(v){return v==null?'<span class="mute">?</span>':v<0?'<span class="pill r">interdit lait</span>':v+' j'}
function finAtt(s,l,k){const v=l[k];if(v==null)return null;if(v<0)return'interdit';return addDays(addDays(s.date,(l.duree||1)-1),v)}
function cible(s){const n=s.animalIds.length;let t='';if(s.lotNom)t=`Lot ${esc(s.lotNom)} (${n})`;else if(n<=3)t=s.animalIds.map(id=>{const a=A(id);return a?esc(a.numero+(a.nom?' '+a.nom:'')):'(supprimé)'}).join(', ');else t=n+' animaux';if(s.autres)t+=(t?' + ':'')+esc(s.autres);return t||'—'}

/* ================= ALERTES ================= */
function alertes(){
  const stockBas=[],perim=[];
  S.produits.filter(suivi).forEach(p=>{const q=stock(p.id),se=seuilEff(p);if(se!=null&&q<=se)stockBas.push({p,q,se});const pe=peremption(p.id);if(pe&&q>0&&pe<=addDays(today(),60))perim.push({p,pe})});
  const att={};const t=today();
  S.soins.forEach(s=>s.lignes.forEach(l=>{['attL','attV'].forEach(k=>{const f=finAtt(s,l,k);if(!f)return;if(f==='interdit'){if(addDays(s.date,(l.duree||1)+6)<t)return}else if(f<t)return;
    const ids=s.animalIds.length?s.animalIds:['_'+s.id];ids.forEach(id=>{const o=att[id]=att[id]||{id,s,lait:null,viande:null,prods:new Set()};o.prods.add(l.produitNom);const key=k==='attL'?'lait':'viande';if(f==='interdit')o[key]='interdit';else if(o[key]!=='interdit'&&(!o[key]||f>o[key]))o[key]=f})})}));
  const rappels=S.soins.filter(s=>s.rappel&&s.rappel>=addDays(t,-15)&&s.rappel<=addDays(t,45)&&!S.soins.some(x=>x.type==='vaccin'&&x.date>=s.rappel&&x.id!==s.id&&x.lignes.some(l=>s.lignes.some(m=>m.produitNom===l.produitNom)))).sort((a,b)=>a.rappel<b.rappel?-1:1);
  return{stockBas,perim,att:Object.values(att),rappels};
}

/* ---------- IMPORT DE FICHIERS (SYNEL, Excel, CSV, PDF, ZIP, dossier) ---------- */
const RACES={'12':'Abondance','14':'Aubrac','31':'Tarentaise','34':'Limousine','38':'Charolaise','39':'Croisé','41':'Brune','46':'Montbéliarde','56':'Normande','57':'Parthenaise','66':"Prim'Holstein",'79':"Blonde d'Aquitaine"};
const RACES_ABR={PH:"Prim'Holstein",HO:"Prim'Holstein",MO:'Montbéliarde',MB:'Montbéliarde',NO:'Normande',CH:'Charolaise',LI:'Limousine',BA:"Blonde d'Aquitaine",BB:'Blanc Bleu',BBB:'Blanc Bleu',CR:'Croisé',RF:'Rouge Flamande',AU:'Aubrac',SA:'Salers'};
const sansAcc=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function normNum(v){let s=String(v??'').toUpperCase().replace(/[\s.\-]/g,'');if(/^\d{10}$/.test(s))s='FR'+s;return/^[A-Z]{2}\d{8,12}$/.test(s)?s:''}
const numKey=v=>normNum(v)||String(v||'').toUpperCase().replace(/[\s.\-]/g,'');
function parseDateAny(v){if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Date.UTC(1899,11,30)+v*864e5).toISOString().slice(0,10);
  const s=String(v??'').trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let y=m[3];if(y.length===2)y=(+y>40?'19':'20')+y;return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{4})(\d{2})(\d{2})$/);return m?`${m[1]}-${m[2]}-${m[3]}`:''}
function parseSexe(v){const s=sansAcc(v);if(!s)return'';if(/castr|boeuf/.test(s))return'Mâle castré';if(/^(f|2$|fem|gen|vache)/.test(s))return'Femelle';if(/^(m|1$|tau|male)/.test(s))return'Mâle';return''}
function parseRace(v){const s=String(v??'').trim();if(!s)return'';if(/^\d{1,2}$/.test(s))return RACES[s.padStart(2,'0')]||'Race '+s;return RACES_ABR[s.toUpperCase()]||s}
const COLS=[['travail',/travail|n\W*trav|^nt$/],['numero',/national|identif|ipg|boucle|^n\W*(animal|bovin)?$|^numero( animal| bovin)?$|^num$/],['nom',/^nom\b/],['race',/race|type racial/],['sexe',/^sexe|^sx$/],['naissance',/naiss|^nee? le|^date de n/],['lot',/^lot|groupe/],['espece',/espece/],['sortie',/sortie/]];
function mapHeader(row){const h={};row.forEach((c,i)=>{const s=sansAcc(c);if(!s||/mere|pere/.test(s))return;for(const[k,re]of COLS)if(h[k]==null&&re.test(s)){h[k]=i;break}});return h.numero!=null&&Object.keys(h).length>=2?h:null}
function lineToAnimal(t){t=String(t);const m=t.toUpperCase().match(/\b([A-Z]{2})[\s.]?(\d{2})[\s.]?(\d{4})[\s.]?(\d{4})\b/);if(!m)return null;
  const a={numero:m[1]+m[2]+m[3]+m[4]};const rest=t.slice(m.index+m[0].length);
  const d=rest.match(/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/);if(d)a.naissance=parseDateAny(d[0]);
  const sx=rest.match(/(?:^|\s)(femelle|m[aâ]le|F|M)(?=\s|$)/i);if(sx)a.sexe=parseSexe(sx[1]);
  const rn=[...Object.values(RACES),'Holstein','Blanc Bleu','Rouge Flamande','Salers','Simmental','Jersiaise'].find(r=>sansAcc(rest).replace(/['\s]/g,'').includes(sansAcc(r).replace(/['\s]/g,'')));if(rn)a.race=rn==='Holstein'?"Prim'Holstein":rn;
  return a}
function rowsToAnimals(rows){const res=[];let h=null,hi=-1;for(let i=0;i<Math.min(rows.length,40);i++){h=mapHeader(rows[i]);if(h){hi=i;break}}
  if(!h){rows.forEach(r=>{const a=lineToAnimal(r.join(' '));if(a)res.push(a)});return res}
  const cel=(r,k)=>h[k]==null?'':r[h[k]]??'';
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const numero=normNum(cel(r,'numero'));if(!numero)continue;const a={numero};
    const nom=[cel(r,'travail'),cel(r,'nom')].map(x=>String(x).trim()).filter(Boolean).join(' ');if(nom)a.nom=nom;
    if(h.race!=null)a.race=parseRace(cel(r,'race'));if(h.sexe!=null)a.sexe=parseSexe(cel(r,'sexe'));if(h.naissance!=null)a.naissance=parseDateAny(cel(r,'naissance'));
    if(h.lot!=null)a.lot=String(cel(r,'lot')).trim();if(h.espece!=null){const e=ESPECES.find(x=>sansAcc(x)===sansAcc(cel(r,'espece')));if(e)a.espece=e}
    if(String(cel(r,'sortie')).trim())a.actif=false;res.push(a)}
  return res}
async function lib(name,src){if(window[name])return window[name];await new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('connexion internet nécessaire pour lire ce type de fichier'));document.head.appendChild(s)});return window[name]}
const readTxt=(f,enc)=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko(r.error);r.readAsText(f,enc)});
async function textOf(f){let t=await readTxt(f,'utf-8');if(t.includes('�'))t=await readTxt(f,'windows-1252');return t}
function splitCSV(l,sep){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===sep){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}
function textToRows(t){const lines=t.split(/\r?\n/).filter(l=>l.trim());const ech=lines.slice(0,30);const sep=[';','\t','|',','].map(c=>[c,ech.join('\n').split(c).length-1]).sort((a,b)=>b[1]-a[1])[0];
  return sep[1]<ech.length?lines.map(l=>[l]):lines.map(l=>splitCSV(l,sep[0]))}
async function xlsRows(buf){const X=await lib('XLSX','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');const wb=X.read(buf,{type:'array',cellDates:true});return wb.SheetNames.map(n=>X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}))}
async function pdfRows(buf){const P=await lib('pdfjsLib','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');P.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await P.getDocument({data:buf}).promise;const rows=[];
  for(let p=1;p<=doc.numPages;p++){const items=(await (await doc.getPage(p)).getTextContent()).items.filter(it=>it.str.trim()).map(it=>({x:it.transform[4],y:it.transform[5],s:it.str})).sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=[],y=null;const fin=()=>{if(cur.length)rows.push([cur.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')]);cur=[]};
    items.forEach(it=>{if(y!==null&&Math.abs(it.y-y)>3)fin();y=it.y;cur.push(it)});fin()}
  return rows}
async function animauxDuFichier(f){const ext=(f.name.includes('.')?f.name.split('.').pop():'').toLowerCase();
  if(['xlsx','xls','xlsm','ods'].includes(ext))return(await xlsRows(await f.arrayBuffer())).flatMap(rowsToAnimals);
  if(ext==='pdf')return rowsToAnimals(await pdfRows(await f.arrayBuffer()));
  if(ext==='zip'){const Z=await lib('JSZip','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');const z=await Z.loadAsync(await f.arrayBuffer());let out=[];
    for(const e of Object.values(z.files)){if(e.dir)continue;const r=await animauxDuFichier(new File([await e.async('blob')],e.name.split('/').pop()));if(r)out=out.concat(r)}return out}
  if(['csv','txt','xml','dat','prn','tsv',''].includes(ext)||(f.type||'').startsWith('text')){let t=await textOf(f);if(ext==='xml')t=t.replace(/<\/[^>]+>\s*(?=<[^\/])/g,'\n').replace(/<[^>]+>/g,' ');return rowsToAnimals(textToRows(t))}
  return null}
function fusionAnimaux(list){const m=new Map();list.forEach(a=>{const o=m.get(a.numero)||{numero:a.numero};for(const[k,v]of Object.entries(a))if(v!==''&&v!=null&&!(k==='actif'&&o.actif===false))o[k]=v;m.set(a.numero,o)});return[...m.values()]}
function appliquerImport(list,sortirAbsents){let nv=0,maj=0,sortis=0;const idx=new Map(S.animaux.map(a=>[numKey(a.numero),a]));
  list.forEach(a=>{const o={};['nom','race','sexe','naissance','espece'].forEach(k=>{if(a[k])o[k]=a[k]});o.actif=a.actif!==false;
    if(a.lot){let l=S.lots.find(x=>sansAcc(x.nom)===sansAcc(a.lot));if(!l){l={id:uid(),nom:a.lot};S.lots.push(l)}o.lotId=l.id}
    const ex=idx.get(a.numero);if(ex){Object.assign(ex,o);maj++}else{const n={id:uid(),numero:a.numero,nom:a.numero.slice(-4),espece:'Bovin',race:'',sexe:'',naissance:'',lotId:'',...o};S.animaux.push(n);idx.set(a.numero,n);nv++}});
  if(sortirAbsents&&list.length){const pres=new Set(list.filter(a=>a.actif!==false).map(a=>a.numero));S.animaux.forEach(a=>{if(a.actif!==false&&!pres.has(numKey(a.numero))){a.actif=false;sortis++}})}
  return{nv,maj,sortis}}
let impList=null;
async function impFichiers(files){const box=document.getElementById('impRes');box.innerHTML='<p class="mute">Lecture des fichiers…</p>';const all=[],lus=[],ign=[];
  for(const f of files){if(/^[.~]/.test(f.name))continue;try{const r=await animauxDuFichier(f);if(r==null){ign.push(f.name);continue}lus.push(esc(f.name)+' : '+r.length);all.push(...r)}catch(e){lus.push(esc(f.name)+' : erreur ('+esc(e.message)+')')}}
  impList=fusionAnimaux(all);const keys=new Set(S.animaux.map(a=>numKey(a.numero)));const nv=impList.filter(a=>!keys.has(a.numero)).length;
  const det=`<p class="hint">Fichiers lus : ${lus.join(' · ')||'aucun'}${ign.length?' — ignorés (format non lu) : '+ign.map(esc).join(', '):''}</p>`;
  box.innerHTML=impList.length?`<div class="alert" style="background:var(--pri2);color:var(--pri)">✔ <b>${impList.length}</b> animal(aux) trouvé(s) : ${nv} nouveau(x), ${impList.length-nv} déjà dans l'application (mis à jour).</div>
  <div class="tw" style="max-height:240px;overflow:auto"><table><tr><th>N° national</th><th>Nom / n° travail</th><th>Race</th><th>Sexe</th><th>Naissance</th><th>Lot</th></tr>${impList.slice(0,300).map(a=>`<tr ${a.actif===false?'style="opacity:.5" title="sorti"':''}><td>${esc(a.numero)}</td><td>${esc(a.nom||a.numero.slice(-4))}</td><td>${esc(a.race||'')}</td><td>${esc(a.sexe||'')}</td><td>${fd(a.naissance)}</td><td>${esc(a.lot||'')}</td></tr>`).join('')}</table></div>
  <label style="flex-direction:row;align-items:center;gap:6px;margin-top:8px"><input type="checkbox" name="sortir" value="1"> Marquer « sortis » les animaux de l'application absents de ces fichiers (inventaire complet)</label>${det}<p class="hint">Cliquez sur <b>Enregistrer</b> pour importer.</p>`
  :`<div class="alert r">Aucun numéro d'animal (FR + 10 chiffres) trouvé dans ces fichiers.</div>${det}<p class="hint">Dans SYNEL, exportez plutôt la liste / l'inventaire des bovins présents (format Excel ou CSV de préférence).</p>`}

  <div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px"><b>📂 Depuis SYNEL (ou un autre logiciel d'élevage)</b>
  <p class="hint">Exportez depuis SYNEL l'inventaire / la liste des bovins (Excel, CSV ou PDF), puis choisissez le ou les fichiers — ou le dossier entier. Formats lus : Excel (.xls, .xlsx), CSV, texte, PDF, XML, ZIP. Les colonnes sont reconnues automatiquement (n° national, n° travail, nom, race, sexe, date de naissance, lot, sortie).</p>
  <div class="row"><label class="b" style="flex-direction:row;cursor:pointer;font-size:15px">📄 Choisir des fichiers<input type="file" multiple accept=".xls,.xlsx,.xlsm,.ods,.csv,.txt,.tsv,.pdf,.xml,.zip" style="display:none" onchange="impFichiers(this.files)"></label>
  <label class="b2" style="flex-direction:row;cursor:pointer;color:var(--pri);font-size:15px">📁 Choisir un dossier<input type="file" webkitdirectory multiple style="display:none" onchange="impFichiers(this.files)"></label></div>
  <div id="impRes"></div></div>
  <details><summary style="cursor:pointer">… ou coller une liste (copier-coller depuis Excel)</summary><p class="hint">Une ligne par animal, colonnes dans cet ordre, séparées par ; ou tabulation :<br><b>N° national ; Nom ; Espèce ; Race ; Sexe (F/M) ; Date naissance (jj/mm/aaaa) ; Lot</b><br>Seul le n° est obligatoire. Les numéros déjà présents sont mis à jour.</p>
  <textarea name="txt" style="width:100%;min-height:160px" placeholder="FR1234567890;Marguerite;Bovin;Prim'Holstein;F;12/03/2021;Vaches laitières"></textarea></details>`,f=>{
  let msg=[];if(impList&&impList.length){const r=appliquerImport(impList,f.get('sortir')==='1');msg.push(`${r.nv} animal(aux) ajouté(s), ${r.maj} mis à jour`+(r.sortis?`, ${r.sortis} marqué(s) sortis`:'')+'.')}
  if(!f.get('txt').trim()){if(!msg.length){alert('Choisissez un fichier ou collez une liste.');return false}alert(msg.join('\n'));return}
  let n=0;f.get('txt').split(/\r?\n/).forEach(line=>{const c=line.split(/;|\t/).map(x=>x.trim());if(!c[0]||/^n[°o]/i.test(c[0]))return;
    let lotId='';if(c[6]){let l=S.lots.find(x=>x.nom.toLowerCase()===c[6].toLowerCase());if(!l){l={id:uid(),nom:c[6]};S.lots.push(l)}lotId=l.id}
    let d='';if(c[5]){const m=c[5].match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let y=m[3].length===2?'20'+m[3]:m[3];d=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}else if(/^\d{4}-\d{2}-\d{2}$/.test(c[5]))d=c[5]}
    const sx=/^m/i.test(c[4]||'')?'Mâle':'Femelle';const esp=ESPECES.find(e=>e.toLowerCase()===(c[2]||'').toLowerCase())||'Bovin';
    const o={numero:c[0],nom:c[1]||'',espece:esp,race:c[3]||'',sexe:sx,naissance:d,lotId,actif:true};const ex=S.animaux.find(a=>numKey(a.numero)===numKey(o.numero));
    if(ex)Object.assign(ex,o);else S.animaux.push({id:uid(),...o});n++});msg.push(n+' animal(aux) importé(s) depuis la liste collée.');alert(msg.join('\n'));});}

  <div class="row" style="margin:10px 0"><input placeholder="Rechercher animal, produit, maladie, ordonnance…" value="${esc(qS)}" oninput="qS=this.value;render();setTimeout(()=>{const i=document.querySelector('main input');i.focus();i.setSelectionRange(99,99)})" style="flex:1"></div>

  ${list.map(s=>`<tr><td>${fd(s.date)}</td><td>${cible(s)}</td><td>${esc(s.motif)}</td><td>${s.lignes.map(l=>`<b>${esc(l.produitNom)}</b> · ${fmt(l.dose)} ${esc(l.unite)} ${esc(l.voie||'')} · ${l.duree||1} j`).join('<br>')}</td><td>${esc(s.ordonnance)}${s.veterinaire?'<br><span class="mute">'+esc(s.veterinaire)+'</span>':''}</td>
  <td>${type==='vaccin'?fd(s.rappel):s.lignes.map(l=>{const a=finAtt(s,l,'attL'),b=finAtt(s,l,'attV');const f=v=>v==null?'?':v==='interdit'?'interdit':fd(v);return f(a)+' / '+f(b)}).join('<br>')}</td>

}

  return`<div class="ligne"><div class="grid">

function prodChoisi(inp){const p=prodByName(inp.value);const box=inp.closest('.ligne');if(!p){box.querySelector('.lc').textContent='Produit inconnu : il sera ajouté au catalogue.';return}
  box.querySelector('.lu').value=p.unite;box.querySelector('.lal').value=p.attL??'';box.querySelector('.lav').value=p.attV??'';
  if(p.cat==='Intramammaire')box.querySelector('.lv').value='Intramammaire';else if(p.cat==='Vaccin')box.querySelector('.lv').value=p.nom.match(/intra ?nasal/i)?'Intranasale':'SC';
  if(p.unite==='dose'||p.unite==='injecteur'||p.unite==='bolus'||p.unite==='dispositif'){const d=box.querySelector('.ld');if(!d.value)d.value=1}
  delete box.querySelector('.lq').dataset.m;recalc()}
function nbAnimaux(){return dform.querySelectorAll('input[name=an]:checked').length+(dform.querySelector('[name=autresN]')?Number(dform.querySelector('[name=autresN]').value||0):0)}
function recalc(){const n=nbAnimaux();const c=dform.querySelector('#nbsel');if(c)c.textContent=n+' animal(aux) sélectionné(s)';
  dform.querySelectorAll('.ligne').forEach(b=>{const d=num(b.querySelector('.ld').value)||0,du=num(b.querySelector('.ldu').value)||1,fr=num(b.querySelector('.lf').value)||1;const tot=d*du*fr*n;const q=b.querySelector('.lq');if(!q.dataset.m)q.value=tot?Math.round(tot*100)/100:'';
    const p=prodByName(b.querySelector('.lp').value);b.querySelector('.lc').innerHTML=p?`${fmt(d)} ${esc(b.querySelector('.lu').value)} × ${du} j × ${fr}/j × ${n} animal(aux) = <b>${fmt(tot)} ${esc(p.unite)}</b> · stock actuel : ${fmt(stock(p.id))} ${esc(p.unite)}`:''})}
function cocherLot(lid){dform.querySelectorAll('input[name=an]').forEach(i=>{if(A(i.value)?.lotId===lid)i.checked=true});dform.querySelector('[name=lotId]').value=lid;recalc()}

  <div class="grid" style="margin-top:6px"><label style="grid-column:span 2">Autres animaux non enregistrés (n°)<input name="autres" value="${esc(s.autres||'')}"></label><label>Nombre de ces animaux<input type="number" min="0" name="autresN" value="${s.autresN||0}" oninput="recalc()"></label></div>

  <label style="margin-top:8px">Observations<textarea name="notes">${esc(s.notes||'')}</textarea></label>

function supprSoin(id){if(!confirm('Supprimer cet enregistrement ?'))return;S.soins=S.soins.filter(s=>s.id!==id);S.mouvements=S.mouvements.filter(m=>m.soinId!==id);save();dlg.close();render()}

/* ---------- STOCKS ---------- */
VIEWS.stock=()=>{
  const ps=S.produits.filter(suivi).sort((a,b)=>a.nom.localeCompare(b.nom));
  const mv=[...S.mouvements].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);
  return`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Stock de la pharmacie</h2><div class="row"><button class="b" onclick="formEntree()">+ Entrée de produits</button><button class="b2" onclick="formInventaire()">Saisir / corriger un stock</button></div></div>
  <p class="hint">Pour commencer : utilisez « Saisir / corriger un stock » pour entrer votre stock actuel, puis « Entrée de produits » à chaque livraison. Les traitements déduisent le stock automatiquement.</p>
  <div class="tw"><table><tr><th>Produit</th><th>Catégorie</th><th>En stock</th><th>Seuil d'alerte</th><th>Péremption</th><th>État</th><th></th></tr>
  ${ps.map(p=>{const q=stock(p.id),pe=peremption(p.id);const st=q<=0?'<span class="pill r">épuisé</span>':seuilEff(p)!=null&&q<=seuilEff(p)?'<span class="pill w">fin de stock</span>':'<span class="pill g">OK</span>';
   const cond=p.contenance&&p.contenance>1?` <span class="mute">(≈ ${fmt(q/p.contenance)} × ${fmt(p.contenance)} ${esc(p.unite)})</span>`:'';
   return`<tr><td><b>${esc(p.nom)}</b><br><span class="mute">${esc(p.principe)}</span></td><td>${esc(p.cat)}</td><td>${fmt(q)} ${esc(p.unite)}${cond}</td><td>${seuilTxt(p)}</td><td>${pe?`<span class="pill ${pe<today()?'r':pe<=addDays(today(),60)?'w':''}">${fd(pe)}</span>`:''}</td><td>${st}</td><td style="white-space:nowrap"><button class="b2 sm" onclick="formEntree('${p.id}')">+ Entrée</button> <button class="b2 sm" onclick="formInventaire('${p.id}')">✎</button></td></tr>`}).join('')||'<tr><td colspan="7" class="mute">Aucun produit en stock pour l\'instant.</td></tr>'}</table></div></div>
  <div class="card"><h2>Derniers mouvements</h2><div class="tw"><table><tr><th>Date</th><th>Produit</th><th>Mouvement</th><th>Quantité</th><th>Détail</th><th></th></tr>
  ${mv.map(m=>{const p=P(m.produitId);return`<tr><td>${fd(m.date)}</td><td>${esc(p?.nom||'?')}</td><td>${m.type==='entree'?'<span class="pill g">Entrée</span>':m.type==='sortie'?'<span class="pill w">Sortie</span>':'<span class="pill">Inventaire</span>'}</td><td>${m.type==='sortie'?'-':m.qte>0?'+':''}${fmt(m.qte)} ${esc(p?.unite||'')}</td><td>${esc(m.ref||'')}${m.lotFab?' · lot '+esc(m.lotFab):''}${m.peremption?' · pér. '+fd(m.peremption):''}${m.fournisseur?' · '+esc(m.fournisseur):''}</td><td>${m.soinId?'':`<button class="del sm" onclick="if(confirm('Supprimer ce mouvement ?')){S.mouvements=S.mouvements.filter(x=>x.id!=='${m.id}');save();render()}">✕</button>`}</td></tr>`}).join('')||'<tr><td colspan="6" class="mute">Aucun mouvement.</td></tr>'}</table></div></div>`;
};
function prodSelect(sel){return`<select name="pid" required onchange="majCond(this)"><option value="">— choisir —</option>${CATS.map(c=>`<optgroup label="${c}">${S.produits.filter(p=>p.cat===c).sort((a,b)=>a.nom.localeCompare(b.nom)).map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.nom)}</option>`).join('')}</optgroup>`).join('')}</select>`}
function majCond(s){const p=P(s.value);if(!p)return;const c=dform.querySelector('[name=cont]');if(c){c.value=p.contenance||1;dform.querySelector('#uu').textContent=p.unite}const sv=dform.querySelector('[name=seuil]');if(sv)sv.value=p.seuil??'';const u=dform.querySelector('#uu2');if(u)u.textContent=p.unite;const cur=dform.querySelector('#cur');if(cur)cur.textContent='Stock enregistré : '+fmt(stock(p.id))+' '+p.unite;calcE()}
function calcE(){const n=num(dform.querySelector('[name=nb]')?.value)||0,c=num(dform.querySelector('[name=cont]')?.value)||0;const p=P(dform.querySelector('[name=pid]').value);const o=dform.querySelector('#tot');if(o)o.innerHTML=p?`Total ajouté : <b>${fmt(n*c)} ${esc(p.unite)}</b> → nouveau stock ${fmt(stock(p.id)+n*c)} ${esc(p.unite)}`:''}
function formEntree(pid){const p=pid?P(pid):null;
  modal(`<h3>Entrée de produits (livraison / achat)</h3><div class="grid">
  <label style="grid-column:span 2">Produit *${prodSelect(pid)}</label>
  <label>Date<input type="date" name="date" value="${today()}"></label>
  <label>Nombre de conditionnements *<input name="nb" inputmode="decimal" required value="1" oninput="calcE()"></label>
  <label>Contenance par conditionnement (<span id="uu">${esc(p?.unite||'')}</span>) *<input name="cont" inputmode="decimal" required value="${p?.contenance||1}" oninput="calcE()"></label>
  <label>N° de lot fabricant<input name="lotFab"></label>
  <label>Date de péremption<input type="date" name="peremption"></label>
  <label>Fournisseur / vétérinaire<input name="fournisseur"></label>
  <label>N° ordonnance / facture<input name="ref"></label>
  <label>Seuil d'alerte (<span id="uu2">${esc(p?.unite||'')}</span>)<input name="seuil" inputmode="decimal" value="${p?.seuil??''}" placeholder="vide = auto (20 %)"></label></div>
  <div class="calc" id="tot"></div><p class="hint">Exemple : 3 flacons de 250 mL → nombre = 3, contenance = 250. Un vaccin de 10 doses → contenance = 10 (unité « dose »). Le produit n'est pas dans la liste ? Ajoutez-le dans l'onglet Produits.</p>`,f=>{
    const p=P(f.get('pid'));if(!p)return false;const q=(num(f.get('nb'))||0)*(num(f.get('cont'))||0);if(q<=0){alert('Quantité invalide');return false}
    p.contenance=num(f.get('cont'));p.seuil=num(f.get('seuil'));
    S.mouvements.push({id:uid(),date:f.get('date')||today(),produitId:p.id,type:'entree',qte:q,lotFab:f.get('lotFab').trim(),peremption:f.get('peremption'),fournisseur:f.get('fournisseur').trim(),ref:f.get('ref').trim()||`${f.get('nb')} × ${f.get('cont')} ${p.unite}`})});
  calcE();}
function formInventaire(pid){const p=pid?P(pid):null;
  modal(`<h3>Saisir / corriger le stock d'un produit</h3><div class="grid">
  <label style="grid-column:span 2">Produit *${prodSelect(pid)}</label>
  <label>Quantité réellement en stock (<span id="uu2">${esc(p?.unite||'')}</span>) *<input name="q" inputmode="decimal" required></label>
  <label>Seuil d'alerte<input name="seuil" inputmode="decimal" value="${p?.seuil??''}" placeholder="vide = auto (20 %)"></label>
  <label>Date de péremption<input type="date" name="peremption"></label></div>
  <p class="hint" id="cur">${p?'Stock enregistré : '+fmt(stock(p.id))+' '+esc(p.unite):''}</p><p class="hint">Indiquez la quantité totale dans l'unité du produit (ex. 2 flacons de 100 mL + un entamé à moitié = 250 mL).</p>`,f=>{
    const p=P(f.get('pid'));if(!p)return false;const q=num(f.get('q'));if(q==null)return false;const d=q-stock(p.id);p.seuil=num(f.get('seuil'));
    if(d!==0||f.get('peremption'))S.mouvements.push({id:uid(),date:today(),produitId:p.id,type:d===0&&f.get('peremption')?'entree':'ajust',qte:d,peremption:f.get('peremption'),ref:'Inventaire'})});}

/* ---------- PRODUITS ---------- */
let qP='',fC='';
VIEWS.produits=()=>{const list=S.produits.filter(p=>(!fC||p.cat===fC)&&(!qP||(p.nom+' '+p.principe).toLowerCase().includes(qP.toLowerCase()))).sort((a,b)=>a.nom.localeCompare(b.nom));
  return`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Catalogue des produits (${list.length})</h2><button class="b" onclick="formProduit()">+ Ajouter un produit</button></div>
  <div class="alert w" style="margin:10px 0">Les délais d'attente pré-remplis sont <b>indicatifs</b> et peuvent changer selon la dose, la voie et l'espèce. La référence reste <b>l'ordonnance et la notice (RCP)</b> — le vétérinaire peut imposer un délai différent. « ? » = à compléter. Base officielle : <a href="https://med-vet.fr" target="_blank" rel="noopener">med-vet.fr</a> (ANMV).</div>
  <div class="row" style="margin-bottom:10px"><input placeholder="Rechercher nom ou molécule…" value="${esc(qP)}" oninput="qP=this.value;render();setTimeout(()=>{const i=document.querySelector('main input');i.focus();i.setSelectionRange(99,99)})" style="flex:1"><select onchange="fC=this.value;render()"><option value="">Toutes catégories</option>${CATS.map(c=>`<option ${fC===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="tw"><table><tr><th>Produit</th><th>Principe actif</th><th>Catégorie</th><th>Unité</th><th>Conditionnement</th><th>Attente lait</th><th>Attente viande</th><th></th></tr>
  ${list.map(p=>`<tr><td><b>${esc(p.nom)}</b>${p.custom?' <span class="pill g">perso</span>':''}</td><td>${esc(p.principe)}</td><td>${esc(p.cat)}</td><td>${esc(p.unite)}</td><td>${p.contenance?fmt(p.contenance)+' '+esc(p.unite):''}</td><td>${attTxt(p.attL)}</td><td>${attTxt(p.attV)}</td><td><button class="b2 sm" onclick="formProduit('${p.id}')">✎</button></td></tr>`).join('')}</table></div></div>`};
function formProduit(id){const p=id?P(id):{cat:'Antibiotique',unite:'mL'};
  modal(`<h3>${id?'Modifier':'Ajouter'} un produit</h3><div class="grid">
  <label style="grid-column:span 2">Nom commercial *<input name="nom" required value="${esc(p.nom)}"></label>
  <label>Principe actif<input name="principe" value="${esc(p.principe)}"></label>
  <label>Catégorie<select name="cat">${CATS.map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
  <label>Unité de stock<input name="unite" list="dl-u" value="${esc(p.unite)}"><datalist id="dl-u"><option>mL</option><option>g</option><option>dose</option><option>comprimé</option><option>injecteur</option><option>bolus</option><option>dispositif</option><option>flacon</option></datalist></label>
  <label>Contenance d'un conditionnement<input name="contenance" inputmode="decimal" value="${p.contenance??''}"></label>
  <label>Attente lait (j, -1 = interdit)<input name="attL" inputmode="numeric" value="${p.attL??''}"></label>
  <label>Attente viande (j)<input name="attV" inputmode="numeric" value="${p.attV??''}"></label>
  <label>Seuil d'alerte stock<input name="seuil" inputmode="decimal" value="${p.seuil??''}" placeholder="vide = auto (20 %)"></label></div>
  ${id&&!S.mouvements.some(m=>m.produitId===id)&&!S.soins.some(s=>s.lignes.some(l=>l.produitId===id))?`<p><button type="button" class="del" onclick="if(confirm('Supprimer ce produit ?')){S.produits=S.produits.filter(x=>x.id!=='${id}');save();dlg.close();render()}">Supprimer le produit</button></p>`:''}`,f=>{
    const o={nom:f.get('nom').trim(),principe:f.get('principe').trim(),cat:f.get('cat'),unite:f.get('unite').trim()||'mL',contenance:num(f.get('contenance')),attL:num(f.get('attL')),attV:num(f.get('attV')),seuil:num(f.get('seuil'))};
    if(S.produits.some(x=>x.nom.toLowerCase()===o.nom.toLowerCase()&&x.id!==id)){alert('Ce nom existe déjà.');return false}
    if(id){Object.assign(p,o);S.soins.forEach(s=>s.lignes.forEach(l=>{if(l.produitId===id)l.produitNom=o.nom}))}else S.produits.push({id:uid(),...o,custom:true})});}

/* ---------- BILAN ---------- */
let bY=today().slice(0,4),bT='';
function bilanRows(){return S.soins.filter(s=>s.date.startsWith(bY)&&(!bT||s.type===bT)).sort((a,b)=>a.date.localeCompare(b.date))}
VIEWS.bilan=()=>{
  const yrs=[...new Set([today().slice(0,4),...S.soins.map(s=>s.date.slice(0,4))])].sort().reverse();
  const rows=bilanRows();const motifs={},prods={};let nbAn=0;
  rows.forEach(s=>{const n=s.animalIds.length+(s.autresN||0);nbAn+=n;motifs[s.motif]=(motifs[s.motif]||0)+1;s.lignes.forEach(l=>{const k=l.produitNom;prods[k]=prods[k]||{q:0,u:P(l.produitId)?.unite||l.unite,n:0,cat:P(l.produitId)?.cat||''};prods[k].q+=l.qte||0;prods[k].n+=n})});
  const ab=Object.entries(prods).filter(([k,v])=>v.cat==='Antibiotique'||v.cat==='Intramammaire').reduce((s,[k,v])=>s+v.n,0);
  return`<div class="card noprint"><div class="row"><label>Année<select onchange="bY=this.value;render()">${yrs.map(y=>`<option ${y===bY?'selected':''}>${y}</option>`).join('')}</select></label>
  <label>Type<select onchange="bT=this.value;render()"><option value="">Traitements + vaccins</option><option value="traitement" ${bT==='traitement'?'selected':''}>Traitements</option><option value="vaccin" ${bT==='vaccin'?'selected':''}>Vaccins</option></select></label>
  <button class="b" onclick="print()">🖨 Imprimer / PDF</button><button class="b2" onclick="exportCSV()">Exporter Excel (CSV)</button></div></div>
  <div class="card"><h2>Bilan sanitaire ${bY} ${bT==='vaccin'?'— vaccinations':bT==='traitement'?'— traitements':''}</h2>
  <p class="mute">Édité le ${fd(today())} · ${rows.length} intervention(s) · ${nbAn} administrations animal · dont ${ab} avec antibiotiques</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div><h4>Par motif</h4><table>${Object.entries(motifs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td class="mute">—</td></tr>'}</table></div>
  <div><h4>Produits consommés</h4><table><tr><th>Produit</th><th>Animaux</th><th>Quantité</th></tr>${Object.entries(prods).sort().map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${fmt(v.q)} ${esc(v.u)}</td></tr>`).join('')||'<tr><td class="mute" colspan="3">—</td></tr>'}</table></div></div>
  <h4>Registre détaillé</h4><div class="tw"><table><tr><th>Date</th><th>Type</th><th>Animaux</th><th>Motif</th><th>Produit</th><th>Dose</th><th>Voie</th><th>Durée</th><th>Ordonnance</th><th>Vétérinaire</th><th>Fin att. lait</th><th>Fin att. viande</th></tr>
  ${rows.map(s=>s.lignes.map((l,i)=>{const f=v=>v==null?'':v==='interdit'?'interdit':fd(v);return`<tr>${i===0?`<td rowspan="${s.lignes.length}">${fd(s.date)}</td><td rowspan="${s.lignes.length}">${s.type==='vaccin'?'Vaccin':'Trait.'}</td><td rowspan="${s.lignes.length}">${s.lotNom?'Lot '+esc(s.lotNom)+'<br>':''}${s.animalIds.map(id=>esc(A(id)?.numero||'?')).join(', ')}${s.autres?', '+esc(s.autres):''}</td><td rowspan="${s.lignes.length}">${esc(s.motif)}</td>`:''}<td>${esc(l.produitNom)}</td><td>${fmt(l.dose)} ${esc(l.unite)}${l.freq>1?' ×'+l.freq+'/j':''}</td><td>${esc(l.voie)}</td><td>${l.duree} j</td>${i===0?`<td rowspan="${s.lignes.length}">${esc(s.ordonnance)}</td><td rowspan="${s.lignes.length}">${esc(s.veterinaire)}</td>`:''}<td>${f(finAtt(s,l,'attL'))}</td><td>${f(finAtt(s,l,'attV'))}</td></tr>`}).join('')).join('')||'<tr><td colspan="12" class="mute">Aucun enregistrement pour cette période.</td></tr>'}</table></div></div>`};
function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const h=['Date','Type','Animaux','Lot','Motif','Produit','Dose','Unité','Voie','Durée (j)','Admin/jour','Quantité','Ordonnance','Date ordonnance','Vétérinaire','Administré par','Fin attente lait','Fin attente viande','Rappel','Observations'];
  const r=bilanRows().flatMap(s=>s.lignes.map(l=>{const f=v=>v==null?'':v==='interdit'?'interdit':fd(v);return[fd(s.date),s.type,s.animalIds.map(id=>A(id)?.numero||'?').concat(s.autres?[s.autres]:[]).join(' '),s.lotNom,s.motif,l.produitNom,fmt(l.dose),l.unite,l.voie,l.duree,l.freq,fmt(l.qte),s.ordonnance,fd(s.dateOrd),s.veterinaire,s.intervenant,f(finAtt(s,l,'attL')),f(finAtt(s,l,'attV')),fd(s.rappel),s.notes]}));
  dl(`bilan-sanitaire-${bY}.csv`,'﻿'+[h,...r].map(x=>x.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')}

  return`<div class="card"><h2>👤 Compte et exploitation</h2>
  <p>Connecté : <b>${esc(C.email)}</b><br>Exploitation : <b>${esc(C.nom)}</b> · ${C.membres} membre(s) avec accès</p>
  <p class="hint">Pour donner accès à ce troupeau à quelqu'un (votre père par exemple) : ajoutez son adresse e-mail ci-dessous. Il crée ensuite son compte avec cette même adresse dans l'application, valide l'e-mail reçu, puis clique sur « Rejoindre ».</p>
  <div class="row"><input id="invEmail" type="email" placeholder="adresse@email.fr" style="flex:1"><button class="b" onclick="CLOUD.inviter(document.getElementById('invEmail').value)">Autoriser cette adresse</button></div>
  ${C.invites.length?`<p class="hint" style="margin-top:10px">Adresses autorisées :</p>${C.invites.map(m=>`<div class="row" style="margin:4px 0"><span class="pill g">${esc(m)}</span><button class="del sm" onclick="CLOUD.retirerInvite('${esc(m)}')">retirer</button></div>`).join('')}`:''}

VIEWS.sauvegarde=()=>compteCard()+`<div class="card"><h2>Sauvegarde de vos données</h2>
  <p>${window.CLOUD?'Vos données sont enregistrées <b>en ligne</b> et synchronisées entre vos appareils. Un fichier de sauvegarde reste utile en cas de fausse manipulation.':'Vos données sont enregistrées <b>dans ce navigateur, sur cet ordinateur</b>. Si vous videz l\'historique du navigateur ou changez d\'ordinateur, elles peuvent être perdues : exportez un fichier de sauvegarde régulièrement (clé USB, e-mail, cloud).'}</p>
  <p class="mute">Dernière sauvegarde : ${S.derniereSauvegarde?fd(S.derniereSauvegarde):'jamais'}</p>
  <div class="row"><button class="b" onclick="exportJSON()">💾 Télécharger une sauvegarde</button>
  <label class="b2" style="flex-direction:row;cursor:pointer;color:var(--pri);font-size:15px">📂 Restaurer une sauvegarde<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label></div></div>
  <div class="card"><h2>Zone dangereuse</h2><button class="del" onclick="if(confirm('Effacer TOUTES les données ? Cette action est définitive.')&&confirm('Vraiment tout effacer ?')){S=blank();save();render()}">Tout effacer</button></div>`;
function exportJSON(){S.derniereSauvegarde=today();save();dl(`sante-troupeau-sauvegarde-${today()}.json`,JSON.stringify(S,null,1),'application/json');render()}
function importJSON(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.produits||!d.soins)throw new Error('fichier non reconnu');if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){S=d;save();render();alert('Sauvegarde restaurée.')}}catch(e){alert('Erreur : '+e.message)}};r.readAsText(file)}

if(window.FIREBASE_CONFIG===undefined&&location.protocol.startsWith('http')){const l=document.getElementById('login');l.innerHTML='<div class="lbox"><h2>🐄 Santé Troupeau</h2><p class="err">Le fichier <b>firebase-config.js</b> est absent ou mal rempli.</p><p class="hint">Il doit contenir <code>window.FIREBASE_CONFIG = { apiKey: ..., ... };</code> — sans « const firebaseConfig = » ni ligne « import ». Voir la notice, étape 2.</p></div>';l.style.display='flex'}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

<script type="module">

let app,AU,FS,auth,db;
try{
  const F=await import(B+'firebase-app.js');AU=await import(B+'firebase-auth.js');FS=await import(B+'firebase-firestore.js');
  app=F.initializeApp(window.FIREBASE_CONFIG);auth=AU.getAuth(app);
  try{db=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})})}catch(e){db=FS.getFirestore(app)}
}catch(e){show(`<p class="err">Impossible de charger le service en ligne : ${e.message}</p><p class="hint">Vérifiez la connexion internet et le fichier firebase-config.js.</p>`);throw e}

function loginForm(err){
  show(`<p class="mute">Connectez-vous ou créez votre compte.</p>
  <label>Adresse e-mail<input id="lgE" type="email" autocomplete="email"></label>
  <label>Mot de passe<input id="lgP" type="password" autocomplete="current-password"></label>
  <p class="err" id="lgErr">${err||''}</p>
  <button class="b" id="lgIn">Se connecter</button><button class="b2" id="lgNew">Créer un compte</button>
  <a href="#" id="lgReset" class="hint">Mot de passe oublié ?</a>`);
  const E=()=>document.getElementById('lgE').value.trim(),Pw=()=>document.getElementById('lgP').value,er=t=>document.getElementById('lgErr').textContent=t;
  document.getElementById('lgIn').onclick=()=>AU.signInWithEmailAndPassword(auth,E(),Pw()).catch(e=>er(msg(e)));
  document.getElementById('lgP').onkeydown=e=>{if(e.key==='Enter')document.getElementById('lgIn').click()};
  document.getElementById('lgNew').onclick=async()=>{try{const c=await AU.createUserWithEmailAndPassword(auth,E(),Pw());AU.sendEmailVerification(c.user).catch(()=>{})}catch(e){er(msg(e))}};
  document.getElementById('lgReset').onclick=e=>{e.preventDefault();if(!E())return er('Indiquez d\'abord votre e-mail.');AU.sendPasswordResetEmail(auth,E()).then(()=>er('E-mail de réinitialisation envoyé.')).catch(e=>er(msg(e)))};
}

const col=()=>FS.collection(db,'exploitations');
async function choisir(u,opts={}){
  show('<p class="mute">Recherche de votre exploitation…</p>');
  try{
    const email=(u.email||'').toLowerCase();
    const H=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const $id=i=>document.getElementById(i);
    const mine=(await FS.getDocs(FS.query(col(),FS.where('membres','array-contains',u.uid)))).docs;
    const inv=(await FS.getDocs(FS.query(col(),FS.where('invites','array-contains',email)))).docs.filter(d=>!(d.data().membres||[]).includes(u.uid));
    // 1) Une invitation en attente : on la propose, même si la personne a déjà sa propre exploitation
    if(inv.length&&!opts.plusTard){
      const d=inv[0],nom=H(d.data().nom);
      const later=mine.length?`<button class="b2" id="xLater">Plus tard</button>`:'';
      if(!u.emailVerified){show(`<p>Vous avez été autorisé(e) à rejoindre l'exploitation <b>${nom}</b>.</p><p>Validez d'abord votre adresse : cliquez sur le lien reçu par e-mail à <b>${H(email)}</b> (regardez aussi dans les indésirables), puis appuyez sur le bouton.</p><button class="b" id="vOk">J'ai validé mon e-mail</button><button class="b2" id="vRe">Renvoyer l'e-mail</button>${later}<button class="b2" id="xOut">Se déconnecter</button><p class="err" id="xErr"></p>`);
        $id('vOk').onclick=async()=>{await u.reload();await u.getIdToken(true);if(auth.currentUser.emailVerified)choisir(auth.currentUser);else $id('xErr').textContent='Adresse pas encore validée.'};
        $id('vRe').onclick=()=>AU.sendEmailVerification(u).then(()=>$id('xErr').textContent='E-mail renvoyé.').catch(e=>$id('xErr').textContent=msg(e));}
      else{show(`<p>Vous êtes invité(e) à rejoindre l'exploitation <b>${nom}</b>. Vous partagerez le même troupeau.</p>${mine.length?`<p class="hint">Vous avez déjà votre propre exploitation (${mine.map(x=>H(x.data().nom)).join(', ')}). Elle restera accessible avec le bouton « Changer d'exploitation » de l'onglet Sauvegarde.</p>`:''}<button class="b" id="jOk">Rejoindre ${nom}</button>${later}<button class="b2" id="xOut">Se déconnecter</button><p class="err" id="xErr"></p>`);
        $id('jOk').onclick=()=>FS.updateDoc(d.ref,{membres:FS.arrayUnion(u.uid)}).then(()=>ouvrir(d.id,u,mine.length+1)).catch(e=>$id('xErr').textContent=msg(e));}
      if(later)$id('xLater').onclick=()=>choisir(u,{plusTard:true});
      $id('xOut').onclick=()=>AU.signOut(auth);return}
    // 2) Membre d'une ou plusieurs exploitations
    if(mine.length){
      const saved=(()=>{try{return localStorage.getItem('st.exploitation.'+u.uid)}catch(e){return null}})();
      const m=mine.length===1?mine[0]:mine.find(x=>x.id===saved);
      if(m)return ouvrir(m.id,u,mine.length);
      show(`<p>Quelle exploitation voulez-vous ouvrir ?</p>${mine.map(x=>`<button class="b" data-e="${x.id}">${H(x.data().nom)}</button>`).join('')}<button class="b2" id="xOut">Se déconnecter</button>`);
      box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>ouvrir(b.dataset.e,u,mine.length));
      $id('xOut').onclick=()=>AU.signOut(auth);return}
    // 3) Aucune exploitation : création
    show(`<p>Bienvenue ! Donnez un nom à votre exploitation pour commencer.</p><p class="hint">Si un membre de votre famille a déjà créé la ferme, ne créez rien : demandez-lui d'autoriser votre adresse <b>${H(email)}</b> (onglet Sauvegarde), puis reconnectez-vous.</p><label>Nom de l'exploitation<input id="nNom" placeholder="GAEC des Prés…"></label><button class="b" id="nOk">Créer</button><button class="b2" id="nOut">Se déconnecter</button><p class="err" id="nErr"></p>`);
    $id('nOut').onclick=()=>AU.signOut(auth);
    $id('nOk').onclick=async()=>{const nom=$id('nNom').value.trim();if(!nom)return;const ref=FS.doc(col());
      try{await FS.setDoc(ref,{nom,membres:[u.uid],invites:[],creePar:email,creeLe:FS.serverTimestamp()});ouvrir(ref.id,u,1)}catch(e){$id('nErr').textContent=msg(e)}};
  }catch(e){show(`<p class="err">${msg(e)}</p><button class="b2" id="eOut">Se déconnecter</button>`);document.getElementById('eOut').onclick=()=>AU.signOut(auth)}
}

/* Les données sont découpées en documents : "base" (animaux, lots, produits) + un document par année pour les soins et les mouvements de stock */
function toParts(s){const p={base:JSON.stringify({animaux:s.animaux,lots:s.lots,produits:s.produits,derniereSauvegarde:s.derniereSauvegarde})};const g={};
  s.soins.forEach(x=>{const k='soins-'+(x.date||'0000').slice(0,4);(g[k]=g[k]||[]).push(x)});s.mouvements.forEach(x=>{const k='mouv-'+(x.date||'0000').slice(0,4);(g[k]=g[k]||[]).push(x)});
  for(const k in g)p[k]=JSON.stringify(g[k]);return p}
function fromParts(p){const b=JSON.parse(p.base||'{}');const s={animaux:b.animaux||[],lots:b.lots||[],produits:b.produits||[],derniereSauvegarde:b.derniereSauvegarde||null,soins:[],mouvements:[]};
  for(const k in p){if(k.startsWith('soins-'))s.soins.push(...JSON.parse(p[k]));else if(k.startsWith('mouv-'))s.mouvements.push(...JSON.parse(p[k]))}return s}

function ouvrir(eid,u,nbExploit){
  const C={eid,nom:'',email:u.email,invites:[],membres:1,nbExploit:nbExploit||1,remote:{},known:{},pending:false,ready:false};
  window.CLOUD=C;
  const KE='st.exploitation.'+u.uid;try{localStorage.setItem(KE,eid)}catch(e){}
  C.changer=()=>{try{localStorage.removeItem(KE)}catch(e){}location.reload()};
  C.quitter=()=>{if(!confirm('Quitter l\'exploitation « '+C.nom+' » ? Vous n\'y aurez plus accès, sauf si un membre vous autorise à nouveau.'))return;FS.updateDoc(FS.doc(db,'exploitations',eid),{membres:FS.arrayRemove(u.uid)}).then(C.changer).catch(e=>alert(msg(e)))};
  const ref=FS.doc(db,'exploitations',eid);
  C.applyRemote=()=>{setS(fromParts(C.remote));C.known={...C.remote};C.pending=false;render()};
  C.push=()=>{const cur=toParts(getS());const batch=FS.writeBatch(db);let n=0;
    new Set([...Object.keys(cur),...Object.keys(C.known)]).forEach(k=>{const v=cur[k]??'[]',old=C.known[k]??'[]';if(v!==old){batch.set(FS.doc(db,'exploitations',eid,'data',k),{json:v,maj:FS.serverTimestamp(),par:u.email});C.known[k]=v;C.remote[k]=v;n++}});
    if(n)batch.commit().catch(e=>alert('Erreur d\'enregistrement en ligne : '+msg(e)));
    if(C.pending)C.applyRemote()};
  C.inviter=m=>{m=String(m||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m))return alert('Adresse e-mail invalide.');FS.updateDoc(ref,{invites:FS.arrayUnion(m)}).catch(e=>alert(msg(e)))};
  C.retirerInvite=m=>FS.updateDoc(ref,{invites:FS.arrayRemove(m)}).catch(e=>alert(msg(e)));
  C.logout=()=>AU.signOut(auth).then(()=>location.reload());
  FS.onSnapshot(ref,d=>{const x=d.data()||{};C.nom=x.nom||'';C.invites=x.invites||[];C.membres=(x.membres||[]).length;if(C.ready&&tab==='sauvegarde'&&!dlg.open)render()});
  FS.onSnapshot(FS.collection(db,'exploitations',eid,'data'),snap=>{
    const r={};snap.forEach(d=>r[d.id]=d.data().json);
    if(!C.ready&&!r.base&&snap.metadata.fromCache)return; // attendre la réponse du serveur avant de conclure que l'exploitation est vide
    C.remote=r;
    if(!C.ready){C.ready=true;box.style.display='none';
      if(!r.base){setS(blank());C.known={};C.push();render();return}
      C.applyRemote();if(mergeCatalogue(getS())){C.push();render()}return}
    if(dlg.open)C.pending=true;else C.applyRemote();
  },e=>show(`<p class="err">Accès aux données impossible : ${msg(e)}</p>`));
}

AU.onAuthStateChanged(auth,u=>{if(!u){window.CLOUD=null;loginForm();return}choisir(u)});
}
</script>
